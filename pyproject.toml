[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stateshift"
version = "0.1.0"
description = "State Transition Gene Prediction: heterogeneous VGAE + in-silico perturbation for prioritising genes that drive a cell-state transition"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Théo Ménard" }]
keywords = ["graph-neural-network", "vgae", "cell-state-transition", "gene-prioritisation", "senescence", "single-cell"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# NOTE — l'environnement de RÉFÉRENCE est `environment.yml` (conda), pas ce
# bloc. La pile scientifique (torch 2.11 CPU, torch-geometric 2.7, pySCENIC,
# scanpy) y est épinglée finement, et c'est elle qui tourne sur GLiCID. Les
# dépendances ci-dessous sont le minimum pour IMPORTER le paquet et faire
# tourner les tests ; elles ne remplacent pas l'env conda pour un vrai run.
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "networkx>=3.3",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
torch = ["torch>=2.11", "torch-geometric>=2.7"]
omics = ["scanpy>=1.11", "anndata>=0.12", "omnipath>=1.0.7"]
# ATTENTION au nom : `snakemake-minimal` est un paquet CONDA (bioconda) et
# n'existe PAS sur PyPI — le déclarer ici rendait `pip install stateshift[run]`
# ininstallable. Côté pip c'est `snakemake`. `environment.yml` garde, lui,
# `snakemake-minimal` : c'est le nom correct dans le monde conda.
# Version épinglée en 7.x : le profil SLURM livré utilise la clé `cluster:`,
# qui a disparu de la syntaxe 8.x.
# `pulp<2.8` n'est pas décoratif : snakemake 7.32 appelle `pulp.list_solvers`,
# supprimé en pulp 2.8. Sans ce pin, pip résout pulp 3.x et `snakemake
# --version` lui-même plante — vérifié dans un venv neuf le 2026-08-14.
# snakemake ne déclare qu'un `pulp` non borné, donc le pin nous revient.
workflow = ["snakemake==7.32.4", "pulp<2.8"]
optim = ["optuna>=4.0"]
# `interpret_embedding` — a rule of the standard DAG, not an optional extra —
# imports umap. It was pinned in environment.yml (umap-learn=0.5) but declared
# nowhere here, so a pip-only install resolved the whole DAG and then died in
# that rule. Same family as the snakemake-minimal name: the conda env was the
# real source of truth and pyproject had drifted from it.
viz = ["umap-learn>=0.5"]
dev = ["pytest>=8.0", "pytest-timeout>=2.3", "ruff>=0.6"]
# Raccourci recommandé : tout ce qu'exige un run réel. Sans lui, l'utilisateur
# doit deviner que le pipeline a besoin de torch ET de snakemake, et il ne le
# découvre qu'au premier échec — au milieu du DAG.
run = [
    "torch>=2.11", "torch-geometric>=2.7",
    "scanpy>=1.11", "anndata>=0.12", "omnipath>=1.0.7",
    "snakemake==7.32.4", "pulp<2.8",
    "optuna>=4.0",
    "umap-learn>=0.5",
]

[project.urls]
Repository = "https://github.com/theomenardschenck/scSTGP"
Documentation = "https://github.com/theomenardschenck/scSTGP/tree/main/docs/guide"

# Point d'entrée console UNIQUE. Il ne remplace pas le mode script : il le
# localise. `stateshift run` retrouve le Snakefile EMBARQUÉ dans le paquet et
# lance exactement la même chaîne que `bash workflow/run.sh`, depuis n'importe
# quel répertoire de travail — ce que run.sh ne peut pas faire, puisqu'il se
# repère par `dirname $0` et exige donc un clone.
[project.scripts]
stateshift = "stateshift.cli:main"

# ─────────────────────────────────────────────────────────────────────────────
# Mise en paquet SANS DÉPLACER DE FICHIER.
#
# `package-dir = {"stateshift" = "src"}` fait de src/ le paquet importable
# `stateshift`, ce qui laisse intacts tous les chemins en dur du Snakefile et
# des scripts SLURM (`src/gnn/gnn_vgae.py`, …). Déplacer l'arborescence aurait
# cassé les 20 scripts cluster et le Snakefile pour un bénéfice cosmétique.
#
# Conséquence assumée — DEUX modes d'import coexistent :
#   • mode script   : `python src/gnn/gnn_vgae.py …` — imports plats
#                     (`from _config import …`) via le bootstrap sys.path.
#                     C'est le mode du cluster et du Snakefile. Inchangé.
#   • mode paquet   : `import stateshift.data.loaders.bulk_rna` — après
#                     `pip install`. C'est le mode des tests et de tout
#                     code nouveau. Il RÉPARE les loaders V6 (bulk_rna /
#                     proteomics), qui utilisent des imports relatifs et
#                     étaient donc inutilisables faute de __init__.py.
#
# `stateshift.workflow` mappe le répertoire workflow/ : le Snakefile, les
# configs et le profil SLURM VOYAGENT avec le paquet. Sans ça, `pip install`
# livrerait la bibliothèque sans le pipeline, et l'outil serait inutilisable
# hors d'un clone — c'est-à-dire inutilisable tout court pour un tiers.
# ─────────────────────────────────────────────────────────────────────────────
# La liste est EXPLICITE et non auto-découverte : avec `packages.find`,
# setuptools installe src/gnn, src/data… comme paquets RACINE (un `import data`
# global qui masquerait n'importe quoi). Vérifié le 2026-07-27.
# src/coexpr_benchmark est volontairement absent : ses fichiers ont un nom
# préfixé par un chiffre (03_compare.py), donc non importables par construction.
# src/validation/figures est absent pour une autre raison : il ne contient que
# les figures d'un mémoire précis, produites depuis des résultats non publiés.
# Le répertoire est gitignoré et reste utilisable en local via
# workflow/rules/memoire.local.smk ; le livrer ferait entrer dans la roue un
# code sans données pour le nourrir.
[tool.setuptools]
package-dir = { "stateshift" = "src", "stateshift.workflow" = "workflow" }
packages = [
    "stateshift",
    "stateshift.gnn",
    "stateshift.optim",
    "stateshift.data",
    "stateshift.data.extract",
    "stateshift.data.loaders",
    "stateshift.data.preprocess",
    "stateshift.perturbation",
    "stateshift.validation",
    "stateshift.validation.cluster",
    "stateshift.validation.explain",
    "stateshift.validation.ora",
    "stateshift.validation.probe",
    "stateshift.validation.qc",
    "stateshift.validation.reports",
    "stateshift.validation.schema",
    "stateshift.validation.viz",
    "stateshift.workflow",
]

# Le Snakefile n'est pas du code importable : sans cette section il serait
# absent de la roue, et `stateshift run` n'aurait rien à exécuter.
[tool.setuptools.package-data]
"stateshift.workflow" = [
    "Snakefile",
    "config/*.yaml",
    "profiles/slurm/*",
    "rules/*.smk",
]

# DEUX fuites distinctes vers la distribution, toutes deux vérifiées le
# 2026-08-17 en inspectant la roue construite (`python -m build --wheel`) :
#
#  1. `rules/*.smk` ci-dessus ratisse le SYSTÈME DE FICHIERS, pas l'index git :
#     une roue construite sur la machine de l'auteur embarquait les extensions
#     locales que `.gitignore` retient (règles du mémoire).
#  2. `include-package-data` vaut TRUE par défaut dès qu'on configure par
#     pyproject.toml. Retirer `stateshift.validation.figures` de `packages` ne
#     suffisait donc pas : le répertoire revenait comme *données* du paquet
#     parent `stateshift.validation`, memoire_figures.py compris.
#
# Le `.gitignore` protège le DÉPÔT, ce bloc protège la DISTRIBUTION. Les deux
# sont nécessaires : ni l'un ni l'autre ne couvre le cas de l'autre.
[tool.setuptools.exclude-package-data]
"stateshift.workflow" = ["rules/*.local.smk"]
"stateshift.validation" = ["figures/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Les modules « script » (gnn_vgae.py) parsent la CLI à l'import : les tests qui
# les touchent passent par des sous-processus, jamais par un import direct.
# `not slow` par défaut : le run end-to-end sur jeu jouet prend ~2 min et
# exécute vraiment le pipeline. Il est opt-in (`pytest -m slow`) et tourne
# dans son propre job de CI, pour que la suite ordinaire reste immédiate.
addopts = "-ra --strict-markers -m 'not slow'"
markers = [
    "slow: test lent (run réel, cluster ou plusieurs minutes)",
    "needs_data: exige les données d'entrée non versionnées (data/)",
    "needs_torch: exige torch + torch-geometric",
]
timeout = 600

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["archive", "src/coexpr_benchmark"]

[tool.ruff.lint]
# Volontairement minimal : ce dépôt est du code scientifique existant, pas un
# terrain de style. On ne retient que ce qui signale un vrai défaut : erreurs de
# syntaxe/runtime (E9), comparaisons impossibles (F63), f-strings et asserts
# malformés (F7), noms non définis (F82).
#
# F401 (import inutilisé) est DÉLIBÉRÉMENT EXCLU, et ce n'est pas de la
# complaisance : `_graph_build_body.py`, `_train_body.py`, `_score_body.py` et
# `_config_derive.py` sont des corps `exec` évalués dans l'espace de noms de
# leur APPELANT. Un import que ruff voit inutilisé dans le parent est souvent
# consommé par le corps. Les 40 occurrences relevées le 2026-07-27 ont été
# examinées : aucune n'est un défaut, et les corriger automatiquement risquait
# de casser des runs. À reprendre si les corps deviennent de vraies fonctions.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
# Même raison, côté F821 : ces fichiers référencent des noms fournis par
# l'appelant au moment de l'`exec`. Ils sont insensés lus isolément.
"src/gnn/gnn_vgae.py" = ["F821"]
"src/gnn/_config_derive.py" = ["F821"]
"src/gnn/_graph_build_body.py" = ["F821"]
"src/gnn/_score_body.py" = ["F821"]
"src/gnn/_train_body.py" = ["F821"]
