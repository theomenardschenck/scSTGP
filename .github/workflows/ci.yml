name: CI

# Ce que cette CI peut et ne peut pas faire.
#
# PEUT : vérifier que le paquet s'installe, que chaque point d'entrée répond à
# --help, que le DAG Snakemake se résout, et que les tests unitaires passent.
# C'est exactement ce qui aurait attrapé les défauts trouvés le 2026-07-27 :
# loaders V6 non importables, `__init__.py` dans .gitignore, cinq validations
# débranchées du DAG.
#
# NE PEUT PAS : exécuter le pipeline. Les entrées (scRNA, DE, HuMess, pySCENIC)
# ne sont pas versionnées et l'entraînement demande des heures. La vérification
# scientifique reste `config.smoke.yaml` sur cluster, hors CI.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Paquet + tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer le paquet (sans la pile lourde)
        run: |
          python -m pip install --upgrade pip
          # torch / torch-geometric / scanpy sont volontairement absents : ils
          # pèsent des Go et rien ici ne les exerce. Les tests qui en dépendent
          # se marquent needs_torch et sont désélectionnés ci-dessous.
          pip install -e '.[dev]'

      - name: Le paquet s'importe et n'installe pas de nom racine générique
        run: pytest tests/test_package_layout.py -q

      - name: Tests unitaires
        run: pytest tests/test_de_schema.py tests/test_optim.py -q
        env:
          # `search.cmd_search` importe optuna ; le test le skippe s'il manque.
          PYTHONWARNINGS: ignore

      - name: Lint (uniquement les vrais défauts, pas le style)
        run: ruff check .

  workflow:
    name: DAG Snakemake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer Snakemake (version ÉPINGLÉE)
        run: |
          python -m pip install --upgrade pip
          # 7.32 est épinglé : Snakemake 8/9 a changé le plumbing de l'exécuteur
          # SLURM, et le profil workflow/profiles/slurm suit la syntaxe 7.x
          # (clé `cluster:`). Migrer est un chantier à part.
          # `snakemake-minimal` is the CONDA name and does NOT exist on PyPI:
          # this line failed at install, so both Snakemake jobs were red before
          # running a single test. The pin now comes from the `workflow` extra
          # in pyproject.toml, which already carries the correct pip name and
          # the `pulp<2.8` bound — one declaration instead of two that drift.
          pip install -e '.[dev,workflow]'

      - name: Le DAG se résout, validations comprises
        run: pytest tests/test_workflow.py -q

  cli:
    name: Contrat CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer avec torch CPU
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install torch-geometric

      - name: Chaque point d'entrée répond à --help
        run: pytest tests/test_cli_contract.py -q
        env:
          GNN_ALLOW_DOWNLOADS: "0"

  end-to-end:
    name: Pipeline complet (jeu jouet)
    runs-on: ubuntu-latest
    # Le seul job qui EXÉCUTE la science : construction du graphe, entraînement,
    # perturbation, agrégation, QC, ORA, rapport — sur ~65 gènes générés,
    # hors ligne, en ~2 min. Il a trouvé quatre défauts réels le jour de sa
    # création, tous invisibles à un contrôle purement structurel.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer la pile d'exécution
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install torch-geometric
          pip install -e '.[workflow,viz]'   # cf. the DAG job: conda name, not PyPI

      - name: Générer le jeu jouet et lancer le pipeline
        run: pytest tests/test_end_to_end_tiny.py -q -m slow
        env:
          GNN_ALLOW_DOWNLOADS: "0"   # aucun accès réseau : tout est pré-généré
          MPLBACKEND: Agg

      - name: Conserver les sorties en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-run-logs
          path: |
            output/tiny/**/logs/**
            output/tiny/**/analysis/**
          retention-days: 7
