name: gnn

channels:
  - conda-forge
  - pytorch
  - pyg

dependencies:
  - python=3.12
  - pip

  # Core scientific stack
  - numpy=2.4
  - pandas=2.3
  - scipy=1.17
  - scikit-learn=1.8
  - numba=0.65
  - llvmlite=0.47
  - networkx=3.6
  - h5py=3.16
  - pyarrow=23.0
  - statsmodels=0.14
  - patsy
  - sympy
  - mpmath

  # Plotting
  - matplotlib=3.10
  - seaborn=0.13
  - bokeh=3.9
  - pillow

  # Single-cell / omics
  - anndata=0.12
  - scanpy=1.12
  - umap-learn=0.5
  - pynndescent
  - natsort
  - legacy-api-wrap

  # Dask stack
  - dask=2026.3
  - distributed=2026.3
  - zarr=3.1
  - numcodecs
  - fsspec
  - cloudpickle
  - toolz
  - cytoolz
  - partd
  - locket
  - msgpack-python
  - lz4
  - tblib
  - zict

  # PyTorch CPU + PyG — installed via pip below
  # (the `pytorch` and `pyg` conda channels lag PyPI; torch 2.11 / pyg 2.7
  #  only exist on PyPI as of 2026-04)

  # Jupyter / IPython
  - ipython=8.12
  - jupyter_client
  - jupyter_core
  - nbclient
  - nbconvert
  - nbformat
  - traitlets

  # Utils
  - requests
  - urllib3
  - idna
  - certifi
  - charset-normalizer
  - tqdm
  - joblib
  - pyyaml
  - click
  - filelock
  - packaging
  - platformdirs
  - psutil
  - python-dateutil
  - pytz
  - tzdata
  - setuptools
  - six
  - typing_extensions
  - beautifulsoup4
  - jinja2
  - markupsafe
  - xxhash
  - frozendict
  - sortedcontainers
  - pyparsing
  - kiwisolver
  - fonttools
  - contourpy
  - cycler
  - numexpr
  - dill

  # Orchestration pipeline
  - snakemake-minimal=7.32

  - pip:
      # PyTorch CPU + PyG (pinned to latest PyPI — not yet on conda channels)
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.11.0
      - torch-geometric==2.7.0

      # pySCENIC + ses deps non-conda
      - git+https://github.com/aertslab/pySCENIC.git@06bafba412792f6efa5a552a23bb221cc3bdea1b
      - arboreto==0.1.6
      - ctxcore==0.2.0
      - loompy==3.0.8
      - interlap==0.2.7
      - multiprocessing_on_dill==3.5.0a4
      - diptest==0.10.0
      - session-info2==0.4
      - fast-array-utils==1.4
      - docopt==0.6.2
      - pipreqs==0.5.0
      - yarg==0.1.9
      
      # OmniPath - bases de données biologiques intégrées
      - omnipath>=1.0.7
