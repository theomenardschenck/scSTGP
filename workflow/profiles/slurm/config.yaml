# ──────────────────────────────────────────────────────────────────
# Profil SLURM (Snakemake 7.x) — soumission cluster GLiCID/Nautilus
# ──────────────────────────────────────────────────────────────────
# Usage :
#   snakemake -s workflow/Snakefile --configfile workflow/config/config.yaml \
#             --profile workflow/profiles/slurm
#   (ou, pour la vague : ...ablation_wave.sh <profil> --profile workflow/profiles/slurm)
#
# ⚠️ SANS ce profil, `snakemake -j N` exécute TOUT en LOCAL (nœud frontal) —
#    aucun job dans squeue, séquentiel, lent. C'était le bug V6.1.3.
#
# Partitions/QOS = défauts des scripts éprouvés (run_v6_train.sh) :
#   CPU : standard / short   |   GPU : gpu / gpus / gpu:1
#   Adapter via `sinfo`/`sacctmgr show qos` si votre cluster diffère.
#
# train_vgae (GPU, ~1-3 h) est routé vers la partition GPU ci-dessous ; toutes
# les autres règles (build_graph, perturb, agrégation, validation) → CPU.

jobs: 20                 # jusqu'à 20 jobs SLURM en parallèle (parallélise les modes/ablations)
latency-wait: 60
printshellcmds: true
rerun-incomplete: true
keep-going: true

default-resources:
  - "mem_mb=8000"
  - "runtime=120"                    # minutes
  - "slurm_partition='standard'"
  - "slurm_qos='short'"              # 'normal' plafonne à 5 min ; 'short' = 24 h
  - "slurm_gres=''"                  # pas de GPU par défaut

# TOUT EN CPU (partition standard / qos short) — pas de routage GPU (choix
# 2026-07-15 : évite les limites de la QOS gpus). train_vgae tourne alors sur CPU
# (gnn_vgae --device auto → CPU) : plus lent (~2-4 h vs ~1 h GPU) mais robuste.
# Runtime relevé pour couvrir le CPU, sous le plafond 24 h de la QOS short.
# Pour re-router train sur GPU plus tard : ré-ajouter slurm_partition='gpu',
# slurm_qos='gpus', slurm_gres='gpu:1' + runtime ≤ plafond QOS gpus.
set-resources:
  - "train_vgae:runtime=480"         # 8 h CPU (marge large ; QOS short = 24 h)

# Soumission via wrapper (ajoute --gres seulement si non vide). Snakemake ajoute
# le jobscript en dernier argument.
cluster: >-
  workflow/profiles/slurm/submit.sh
  {rule} {threads} {resources.mem_mb} {resources.runtime}
  {resources.slurm_partition} {resources.slurm_qos} '{resources.slurm_gres}'
