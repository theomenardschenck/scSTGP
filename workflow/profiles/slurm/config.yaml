# ──────────────────────────────────────────────────────────────────
# Profil SLURM (Snakemake 7.x) — soumission cluster GLiCID/Nautilus
# ──────────────────────────────────────────────────────────────────
# Usage :
#   snakemake -s workflow/Snakefile --configfile workflow/config/config.yaml \
#             --profile workflow/profiles/slurm
#
# ⚠️ À ADAPTER : remplacer la partition `standard` (et ajouter --account si
#    requis) par les vôtres. `squeue`/`sinfo` pour lister les partitions.
#
# Ce profil cible les étapes CPU (perturbation → agrégation → validation).
# Pour l'entraînement VGAE (GPU long), 2 options :
#   (a) RECOMMANDÉ : entraîner via scripts/run_ablation_grid.sh (array GPU
#       éprouvé), puis lancer ce pipeline avec models.vgae.enabled: false ;
#   (b) router rule train_vgae vers une partition GPU (ajouter une entrée
#       set-resources train_vgae: slurm_partition=<gpu> + --gres dans cluster).

jobs: 20
latency-wait: 60
printshellcmds: true
rerun-incomplete: true
keep-going: true

default-resources:
  - "mem_mb=8000"
  - "runtime=120"
  - "slurm_partition='standard'"

cluster: >-
  mkdir -p logs/slurm &&
  sbatch --parsable
  --partition={resources.slurm_partition}
  --cpus-per-task={threads}
  --mem={resources.mem_mb}
  --time={resources.runtime}
  --job-name=smk-{rule}
  --output=logs/slurm/{rule}_%j.log
