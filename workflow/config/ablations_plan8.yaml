# ===========================================================================
# ablations_plan8.yaml — plan 2x2x2 : circularité des arêtes x orientation FI
#                        x circularité des attributs.  Préparé le 2026-08-07.
#
# REMPLACE la vague `ablations_rfi_v2.yaml` comme dispositif de référence du
# mémoire. Huit configurations, trois seeds déterministes chacune.
#
#   facteur 1  T / S   les couches inférées de nos données sont-elles présentes
#   facteur 2  o / c   l'orientation de Reactome FI est-elle exploitée
#   facteur 3  -/-de   les attributs différentiels sont-ils donnés au modèle
#
# ---------------------------------------------------------------------------
# CE QUI CHANGE PAR RAPPORT À rfi2, ET POURQUOI
# ---------------------------------------------------------------------------
#
# (1) T GARDE LE PPI, dédupliqué.  Dans rfi2, `pure` = `--no-ppi`. C'était
#     confondre deux choses. STRING au seuil 900 est une interaction, avec un
#     contenu causal ; Reactome `same_pathway` n'est qu'une co-appartenance à un
#     module, c'est-à-dire un a priori de cohérence, pas une communication.
#     PPI entre donc dans le socle des deux bras, `same_pathway` reste du côté S.
#     Conséquence chiffrée : le facteur 1 n'oppose plus 116 k arêtes à 689 k
#     (facteur 6 de densité) mais deux graphes de densité comparable, donc il
#     mesure la circularité au lieu de mesurer la densité.
#
# (2) LE DOUBLON PPI EST CORRIGÉ PARTOUT.  `--dedup-ppi-mirror` (défaut ON)
#     replie les lignes miroir de STRING : chaque interaction non orientée est
#     stockée 2x et non 4x. Mesuré sur S-c : rho(x4, x2) = 0.488 et 33/100 du
#     top-100 conservé, très en dessous du plancher de bruit 0.79-0.80. Ce
#     n'est donc pas un détail.
#
# (3) `--dedup-ppi-signed` EST IDENTIQUE DANS LES DEUX BRAS.  Dans rfi2 il
#     valait `remove` côté pure et `off` côté rich. C'était sans effet tant que
#     `pure` n'avait aucun PPI ; maintenant que T en a, l'asymétrie deviendrait
#     un second facteur caché. Fixé à `off` partout (= comportement S actuel).
#
# (4) T PERD TOUT HUMESS : arêtes de co-catalyse, imp_P4, imp_P16, imp_delta
#     ET has_humess, via le raccourci `--no-humess` (_config.py:466). Dans rfi2,
#     `pure` ne coupait que les arêtes et gardait les quatre attributs, si bien
#     qu'AUCUN bras n'était réellement non circulaire. C'est le trou que
#     l'annexe C du mémoire admet noir sur blanc.
#
# (5) T PERD `variance`.  ⚠ DÉCISION À CONFIRMER. Cette feature est la variance
#     de l'expression moyenne ENTRE les cinq groupes cellulaires
#     (_graph_build_body.py:586) : c'est un contraste inter-conditions, pas une
#     propriété topologique, et T est défini comme une topologie seule. La
#     mesure va dans le même sens et surprend :
#
#         rho(|log2FC|, variance)   = +0.285   <- la vraie fuite
#         rho(|log2FC|, reg_degree) = +0.215
#         rho(|log2FC|, imp_delta)  = +0.004   <- quasi orthogonale
#         rho(|log2FC|, is_tf / ppi_degree) ~ 0
#
#     Autrement dit le soupçon que le mémoire fait peser sur `imp_delta` est mal
#     dirigé : le flux métabolique est presque indépendant du contraste
#     transcriptionnel, alors que `variance` le suit. Retirer `imp_delta` sans
#     retirer `variance` laisserait la fuite principale ouverte.
#     Pour annuler ce choix : supprimer `--exclude-features variance` de _T.
#
# (6) `ppi_degree` et `reg_degree` REDEVIENNENT ACTIFS EN T.  rfi2 les excluait
#     parce que `pure` n'avait pas de PPI, ce qui les rendait constants. Avec le
#     PPI dans le socle ils sont calculables et identiques de part et d'autre.
#
# (7) LE SCORE N'A PLUS DE TERME DE CENTRALITÉ NI D'ATTÉNUATION DE HUB
#     (LOG §46). C'est dans `perturb_report._compute_driver_score`, donc
#     automatique pour cette vague : rien à passer en drapeau.
#
# ---------------------------------------------------------------------------
# CE QUI RESTE OUVERT, ET QUI N'EST PAS CORRIGÉ ICI
# ---------------------------------------------------------------------------
#
#   * `regulates` (régulons pySCENIC, 3 253 arêtes) est inféré de NOS données et
#     reste dans les deux bras. C'était déjà la « seule concession » de rfi2.
#     Le retirer de T demanderait d'ajouter `--no-scenic-regulons` à _T, ce qui
#     rendrait T strictement non circulaire côté arêtes. Non fait faute d'un
#     arbitrage : cela coûte la seule couche orientée dense après FI.
#   * Le seuil STRING reste à 900 (`--ppi-score-thresh`, défaut).
#   * `--supervised` reste OFF. Avec `--de-features` ET une tête supervisée non
#     détachée, la DE entrerait DEUX fois (attributs + gradient) : ne pas
#     l'activer sur cette vague.
#
# ---------------------------------------------------------------------------
# LANCEMENT (détaché : l'orchestrateur doit survivre pour soumettre l'aval)
# ---------------------------------------------------------------------------
#   tmux new -s plan8
#   scripts/run_omnipath_ablation_wave.sh workflow/config/ablations_plan8.yaml \
#       --profile workflow/profiles/slurm -j 8 --parallel 2
#   # puis :
#   python src/validation/qc/pipeline_qc.py all --wave output/gnn_vgae/V6.3/output_plan8
#   python scripts/gene_reference_table.py && python scripts/build_ora_memoire.py
#   python src/validation/figures/memoire_figures.py --regime-default ... && \
#       python scripts/build_annexes.py
# ===========================================================================

root_tag: "plan8"

# ── GRAINES : première passe à 3, extension à 6 possible plus tard ──────────
# Snakemake est piloté par les fichiers : chaque graine vit dans son propre
# `s<N>/`. Pour ajouter 3 graines, passer `seeds: [1, 2, 3, 4, 5, 6]` et
# relancer la MÊME commande. Les graines 1-3 sont reconnues terminées et
# sautées ; seules 4-6 sont entraînées, puis `aggregate_cross_seed` réagrège
# sur les six (la règle prend `seed=SEEDS` en entrée, donc l'agrégat est
# recalculé automatiquement).
# ⚠ Le déterminisme rend cette extension légitime : les graines 1-3 réagrégées
# à six sont bit-à-bit les mêmes qu'à trois. Sans lui, l'agrégat changerait
# pour deux raisons à la fois.
# ⚠ Penser à relancer ensuite gene_reference_table -> build_ora_memoire ->
# memoire_figures -> build_annexes : le mémoire lit l'agrégat, pas les graines.
seeds: [1, 2, 3]
deterministic: true      # bruit d'exécution nul, vérifié bit-exact (LOG §43)

# Décoy : n>=50 OBLIGATOIRE (LOG §25bis). À n=3-5 les écarts-types sont
# sous-estimés d'un ordre de grandeur et les « passages » s'évaporent à n=50.
decoy: true
decoy_n_rewires: 50
decoy_frozen_axis: false
decoy_random_axis: 20        # nulle de spécificité d'axe (distincte du décoy)
decoy_random_axis_seed: 0

# Axes : `diff` reste le headline. La comparaison d'estimateurs est
# re-projetée depuis le cache Δz, donc gratuite. `pca` est le null non
# supervisé : s'il donne les mêmes drivers, l'axe n'apporte rien.
axis_method: diff
axis_method_compare: "diff,lda,cav,pca"
axis_cav_permutations: 100

# Axes par sous-état et par transition. Le chapitre 4 en tire une section : les
# axes P4 -> c_k redisent l'axe global (rho 0.66-0.83) mais les transitions
# tardives changent de réponse (rho 0.32-0.57) et sortent le module métabolique.
# ⚠ Ces clés DOIVENT être sous `perturbation:` : le wrapper ne fusionne que ce
# bloc (run_omnipath_ablation_wave.sh, deep_merge sur p.get("perturbation")).
# À la racine elles seraient silencieusement ignorées et la vague sortirait sans
# les `cross_seed_gene_ranking__trans_*.tsv`.
perturbation:
  transition_axes: default      # P4 -> chaque cluster + chemin c0 -> c1 -> c2 -> c3
  cluster_anchor_mode: de-markers

# `--supervised --supervised-detach` = tête de prédiction des sous-clusters en
# régime PROBE (Alain & Bengio 2016) : la tête est entraînée sur mu GELÉ, le
# gradient ne remonte PAS dans l'encodeur (vérifié : 9.34 -> 0.00, LOG §39).
# C'est le SEUL régime admissible ici. En régime joint (défaut), les labels DEG
# façonnent le latent et la DE entre dans le modèle SANS `--de-features`, ce qui
# détruirait le facteur 3 : les huit configurations deviendraient circulaires et
# le contraste `-de` ne mesurerait plus rien.
# Ce que la tête apporte : une mesure de l'information de sous-état RÉELLEMENT
# présente dans le latent, et la saliency grad x input par cluster.
base_extra_flags: >-
  --signed-message --signed-decoder --use-reactome-fi
  --use-omnipath-signaling --use-omnipath-tf-curated
  --use-omnipath-node-features
  --omnipath-edges transcriptional,enzyme_substrate,ligand_receptor
  --dedup-ppi-mirror --dedup-ppi-signed off
  --supervised --supervised-detach

# ── Bras T : topologie seule ────────────────────────────────────────────────
# Gardé   : ppi (x2), signaling, tf_curated, reactome_fi (+undirected en `o`),
#           regulates, features is_tf / ppi_degree / reg_degree / OmniPath.
# Retiré  : same_pathway (co-appartenance), coexpression, HuMess (arêtes ET les
#           4 features), arêtes gène-état, variance inter-groupes.
_T: &T >-
  --no-reactome --no-coexpr --no-humess --no-cell-group-edges
  --exclude-features variance

# ── Facteur 2 : orientation de Reactome FI ─────────────────────────────────
# `o` exploite la colonne Direction : 73 370 arêtes orientées et signées, et
# 140 024 arêtes d'orientation inconnue versées dans `reactome_fi_undirected`,
# un type distinct. Il ne les JETTE pas (ce serait --no-reactome-fi-undirected,
# qui n'est pas dans ce plan). `c` symétrise les 265 640 en un seul type.
_O: &O "--reactome-fi-directed"

ablation_grid:
  # ── Plan principal, sans attributs différentiels ──────────────────────────
  - {name: T-o,    add_flags: "--no-reactome --no-coexpr --no-humess --no-cell-group-edges --exclude-features variance --reactome-fi-directed"}
  - {name: T-c,    add_flags: *T}
  - {name: S-o,    add_flags: *O}
  - {name: S-c,    add_flags: ""}

  # ── Facteur 3 : mêmes graphes + attributs différentiels (CIRCULAIRES) ─────
  # `--de-features` injecte log2FC global et par cluster, -log10(padj) et
  # Delta-pct comme features de nœud. Ces quatre configurations ne sont PAS des
  # candidates au classement headline : elles mesurent quelle part du classement
  # est redérivable de l'analyse différentielle, module par module.
  # Attendu, d'après la mesure partielle de `deprobe` (LOG §43 A) : la chromatine
  # se reconstitue en partie (module 7 486 -> 2 105), les phospho-inositides sont
  # insensibles (3 469 -> 3 272). Le plan complet dit si cela vaut aux 4 vues.
  - {name: T-o-de, add_flags: "--no-reactome --no-coexpr --no-humess --no-cell-group-edges --exclude-features variance --reactome-fi-directed --de-features"}
  - {name: T-c-de, add_flags: "--no-reactome --no-coexpr --no-humess --no-cell-group-edges --exclude-features variance --de-features"}
  - {name: S-o-de, add_flags: "--reactome-fi-directed --de-features"}
  - {name: S-c-de, add_flags: "--de-features"}

# ── VALIDATION : TOUS les modules, sur TOUTES les configurations ────────────
# Chaque module est déclaré explicitement même quand config.yaml l'active déjà :
# une vague doit être lisible seule, et un défaut qui change en amont ne doit
# pas modifier silencieusement ce qui a été mesuré.
validation:
  qc:
    enabled: true             # pipeline_qc : intégrité des sorties par run
  cluster_annotation:
    enabled: true             # annotation biologique des 5 cell_groups
  decoy:
    enabled: true             # rappel : n_rewires/random_axis fixés plus haut
  driver_baselines:
    enabled: true             # rho(degré), AUROC CellAge brut ET intra-degré
  head_to_head:
    # Le GNN fait-il mieux qu'une statistique simple par source ? Verdict connu
    # sur V5.4.1 : la co-expression retrouve seule la chromatine (corrobore,
    # ne découvre pas), aucune statistique simple ne sort le module métabolique.
    # À rejouer ici parce que T contient désormais le PPI.
    enabled: true
  readout_specificity:
    enabled: true
  ora_de_baseline:
    enabled: true
  purity_source:
    # Le facteur 2 modifie l'orientation de reactome_fi, et `mediate` a établi
    # que le trio métabolique est médié par cette couche (cos -0.48 -> -0.11 en
    # la coupant). C'est donc la mesure directe de ce que l'orientation déplace,
    # gène par gène et source par source.
    enabled: true
    targets: "OCRL SYNJ2 SMPD1 KMT2A DOT1L HMGB1 ISG15"
    n_random: 200
  signed_cascade:
    enabled: true
  memoire_figures:
    enabled: true             # F1-F13 par configuration + MANIFEST
