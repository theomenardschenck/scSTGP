# ──────────────────────────────────────────────────────────────────
# Configuration — pipeline VGAE HUVEC sénescence (Snakemake fonctionnel)
# ──────────────────────────────────────────────────────────────────
# Cf. ../README.md et ../../docs/pipeline_design.md.
#
# Ce fichier pilote RÉELLEMENT le Snakefile (plus de stub). Les chemins
# `paths.*` sont injectés à gnn_vgae.py via les variables d'environnement
# GNN_DATA_DIR / GNN_OUT_DIR_BASE / GNN_HUMESS_DIR / GNN_SCENIC_DIR
# (défauts GLiCID préservés si non surchargés).
#
# Usage :
#   snakemake -n --configfile workflow/config/config.yaml         # dry-run
#   snakemake --use-conda --cores 8 --configfile workflow/config/config.yaml

run:
  name: "huvec_snakemake"
  description: "VGAE HUVEC — train × seeds → perturbation → scoring → validation"

# ── Chemins (un clone sur le cluster pointe data_root vers les données stagées)
paths:
  data_root: "data"                  # → GNN_DATA_DIR (gnn_data, PPI, databases, pyscenic, omnipath)
  out_base: "output/snakemake"       # → GNN_OUT_DIR_BASE + racine analyses
  humess_dir: "data/humess/output_huvec"   # → GNN_HUMESS_DIR
  scenic_dir: "output/pyscenic"      # → GNN_SCENIC_DIR
  de_magnitude_csv: "data/gnn_data/DEGs_P4_vs_P16_MAST.csv"
  coexpr_file: "data/pyscenic/diff_coexpr/coexpr_diff.tsv"

# ── Calcul
compute:
  device: "cpu"            # perturbation : cpu | cuda | auto
  python: "python"         # interpréteur principal (pandas/scipy)
  python_torch: "python"   # interpréteur torch+umap (interpret_embedding / decoy)

# ── Stage 1-4 : entrées précalculées (preprocessing R / pySCENIC / HuMess
#    restent des prérequis externes — non orchestrés ici).
input:
  rna_type: scrna
  degs_path: "data/gnn_data/DEGs_P4_vs_P16_MAST.csv"

# ── Stage 6 : entraînement VGAE
models:
  vgae:
    enabled: true           # false = réutilise des runs déjà entraînés dans out_base
    run_tag: "full"         # tag de base ; run par seed = "<run_tag>.s<seed>"
    seeds: [1, 2, 3]
    extra_flags: ""         # ex. "--signed-message --signed-decoder" (config V5)
  gnn_lite:
    enabled: false

# ── Stage 7 : perturbation in silico
perturbation:
  enabled: true
  modes: [knockdown, knockout, overexpress]
  scope: all_genes
  axis_tag: ""              # "" = axe V3 (P4) ; "axisV4" si --axis v4 utilisé
  out_suffix: ""            # suffixe de fichier (doit refléter l'axe ; "" par défaut)

# ── Stage 8 : agrégation cross-seed (perturb_report)
scoring:
  de_significance: "pvalue" # pvalue (MAST padj+|logFC|) | magnitude-rank
  de_padj_max: 0.05
  de_abs_lfc_min: 0.5

# ── Stage 8b/9 : validation
validation:
  ora_top_n: 100
  decoy:
    enabled: false          # null-models décoy (lourd, torch)
    top_n: 40
  cluster_annotation:
    enabled: true

# ── Stage 10 : cross-method (opt-in, non câblé end-to-end)
comparison:
  enabled: false

output:
  generate_html_report: false
