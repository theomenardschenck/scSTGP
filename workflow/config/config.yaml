# ──────────────────────────────────────────────────────────────────
# Configuration — pipeline VGAE HUVEC sénescence (Snakemake fonctionnel)
# ──────────────────────────────────────────────────────────────────
# Cf. ../README.md et ../../docs/pipeline_design.md.
#
# Ce fichier pilote RÉELLEMENT le Snakefile (plus de stub). Les chemins
# `paths.*` sont injectés à gnn_vgae.py via les variables d'environnement
# GNN_DATA_DIR / GNN_OUT_DIR_BASE / GNN_HUMESS_DIR / GNN_SCENIC_DIR
# (défauts GLiCID préservés si non surchargés).
#
# Usage :
#   snakemake -n --configfile workflow/config/config.yaml         # dry-run
#   snakemake --use-conda --cores 8 --configfile workflow/config/config.yaml

run:
  name: "huvec_snakemake"
  description: "VGAE HUVEC — train × seeds → perturbation → scoring → validation"

# ── Chemins (un clone sur le cluster pointe data_root vers les données stagées)
paths:
  data_root: "data"                  # → GNN_DATA_DIR (gnn_data, PPI, databases, pyscenic, omnipath)
  out_base: "output/snakemake"       # → GNN_OUT_DIR_BASE + racine analyses
  humess_dir: "data/humess/output_huvec"   # → GNN_HUMESS_DIR
  scenic_dir: "output/pyscenic"      # → GNN_SCENIC_DIR
  de_magnitude_csv: "data/gnn_data/DEGs_P4_vs_P16_MAST.csv"
  coexpr_file: "data/pyscenic/diff_coexpr/coexpr_diff.tsv"

# ── Calcul
compute:
  # V6.2 (2026-07-21, LOG §27) : OBLIGATOIRE. Sans lui, deux runs de config
  # IDENTIQUE a seed fixe donnent rho=0.556-0.687 sur driver_score (ecart median
  # 942 rangs) -> aucune ablation n'est interpretable. Cout : threads=1.
  deterministic: true
  device: "cpu"            # perturbation : cpu | cuda | auto
  python: "python"         # interpréteur principal (pandas/scipy)
  python_torch: "python"   # interpréteur torch+umap (interpret_embedding / decoy)
  backend: "local"         # défaut du wrapper workflow/run.sh : local | cluster
                           # (local = warning + --cores ; cluster = --executor slurm)

# ── Stage 1-4 : entrées précalculées (preprocessing R / pySCENIC / HuMess
#    restent des prérequis externes — non orchestrés ici).
input:
  rna_type: scrna
  degs_path: "data/gnn_data/DEGs_P4_vs_P16_MAST.csv"

# ── Stage 0 : build features data-dérivées (coexpr + HuMess) depuis une matrice
#    enabled=false (défaut) → coexpr/HuMess = entrées EXTERNES (HUVEC précalculé).
#    enabled=true → orchestre prep→coexpr→HuMess via run_v6_build.sh.
#    « Démarrer à l'assemblage » : laisser enabled=true ; si coexpr_diff.tsv +
#    cs_gene_to_importance existent, Snakemake saute build_features.
#    ⚠️ HuMess exige cplex (local) → lancer ce stage en LOCAL, pas sur le cluster.
build:
  enabled: false
  matrix: "data/bulkRNAseq/GSE163251_huvec/GSE163251_fpkm_all.txt"
  metadata: "data/bulkRNAseq/GSE163251_huvec/GSE163251_metadata.tsv"
  gene_col: "Tracking_id"
  group_col: 2
  young_group: "pro"
  sen_group: "sen"
  conditions: ["pro", "sen"]    # conditions HuMess attendues (= cell_groups)
  humess_repo: "../humess"
  humess_cs_nsamples: 1000
  # coexpr écrit dans dirname(paths.coexpr_file) ; HuMess dans paths.humess_dir.

# ── Stage 6 : entraînement VGAE
models:
  vgae:
    enabled: true           # false = réutilise des runs déjà entraînés dans out_base
    run_tag: "full"         # tag de base ; run par seed = "<run_tag>.s<seed>"
    seeds: [1, 2, 3]
    extra_flags: ""         # ex. "--signed-message --signed-decoder" (config V5)
  gnn_lite:
    enabled: false

# ── Stage 7 : perturbation in silico
perturbation:
  enabled: true
  modes: [knockdown, knockout, overexpress]
  scope: all_genes
  axis_tag: ""              # "" = axe V3 (P4) ; "axisV4" si --axis v4 utilisé
  out_suffix: ""            # suffixe de fichier (doit refléter l'axe ; "" par défaut)
  # ── Readout multi-état (LOG #log-multiaxis) — défauts OFF (comportement inchangé)
  transition_axes: none     # none|default|all-pairs — axes de transition inter-cluster
                            #   (default = P4→chaque cluster + chemin c0→c1→c2→c3).
                            #   REQUIS pour obtenir les cross_seed_gene_ranking__trans_*.tsv
  cluster_anchor_mode: none # none|de-markers|manual — ancre les centroïdes de cluster
                            #   (manual = ancres Ahn 2025 ; change aussi l'axe global)
  # Fichier d'ancres pour cluster_anchor_mode=manual (axe polycentrique) : TSV
  # (group, gene, weight) — un centroïde pondéré par cell_group. Relatif à data_root
  # ou absolu. "" → défaut data/gnn_data/ahn_cluster_anchors.tsv (Ahn 2025).
  cluster_anchors_file: ""
  cache_delta_z: true

  # ── F1 (FUT §2.8) : ESTIMATEUR de l'axe global — mêmes pôles, direction
  #    dérivée autrement. Deux réglages DISTINCTS :
  #  axis_method         = l'estimateur du driver_score HEADLINE, figé à la
  #                        perturbation. Le changer change LE résultat publié.
  #  axis_method_compare = liste re-projetée APRÈS coup depuis le cache Δz
  #                        (reproject_axes.py) : aucune re-perturbation,
  #                        ~secondes. Voie à privilégier — donne « N définitions
  #                        d'axe × mêmes drivers » sans engager le headline.
  #    diff = différence de centroïdes (défaut historique)
  #    lda  = direction blanchie Sw⁻¹Δμ (Fisher 1936) — corrige la covariance
  #           que 'diff' ignore ; teste directement l'axe flottant (ASNS :
  #           cos 0.058→0.514 selon kl1, donc l'axe PIVOTE avec les hyperparams)
  #    cav  = normale d'un probe logistique (Kim 2018, TCAV)
  #    pca  = PC1 du latent — NULL NON SUPERVISÉ : si 'pca' donne les mêmes
  #           drivers que 'diff', l'axe n'apporte rien de plus que la variance
  #           dominante du latent.
  axis_method: diff
  axis_method_compare: ""        # ex. "diff,lda,cav,pca" — exige cache_delta_z
  axis_lda_shrinkage: 0.05       # 0 = LDA pur, 1 = retour à 'diff'
  axis_cav_top_n: 500
  axis_cav_seed: 0
  axis_cav_permutations: 0       # null TCAV sur l'accuracy du probe ; 100 = p-value       # défaut ON : persiste le cache Δz → re-projection d'axes
                            #   ultérieure sans re-perturber (reproject_axes.py)

# ── Stage 8 : agrégation cross-seed (perturb_report)
scoring:
  de_significance: "pvalue" # pvalue (MAST padj+|logFC|) | magnitude-rank
  de_padj_max: 0.05
  de_abs_lfc_min: 0.5

# ── Stage 8b/9 : validation
validation:
  ora_top_n: 100
  # Decoy de base = deux nulls de sanity (montrent que le signal vient du graphe
  # réel et de l'axe réel, pas d'un artefact) :
  decoy:
    enabled: false          # decoy d'ARÊTES : rewire degré/type-préservant des
                            #   connexions des top-N drivers (même nombre d'arêtes
                            #   par edge_type, partenaires+signes aléatoires ;
                            #   rule perturb_decoy → decoy_confidence.tsv). torch.
    top_n: 40
    n_rewires: 50           # >= 50 OBLIGATOIRE (LOG §25bis) : à n=5 les écarts-types
                            #   sont sous-estimés ~10x (HMGB2 0.3->4.4) et 3 des 4
                            #   « passages » s'évaporent à n=50. L'ancien défaut
                            #   était 3 ⇒ toute colonne decoy_confidence produite
                            #   avant 2026-07-21 est NON FIABLE.
    frozen_axis: false      # projette la nulle sur l'axe du graphe RÉEL au lieu de
                            #   re-dériver un axe par rewiring. Testé : ne change
                            #   rien (LOG §26ter) — gardé comme contrôle, off.
    random_axis: 20         # decoy d'AXE : N axes unitaires aléatoires comparés à
                            #   l'axe réel (spécificité ; 0 = off). Écrit pendant
                            #   perturb : perturbation_*_random_axis_<mode>.tsv.
                            #   ON PAR DÉFAUT (2026-07-21) : coût quasi nul — N
                            #   reprojections du cache Δz déjà calculé, dans le run
                            #   perturb existant. Contrairement à `enabled` (N2)
                            #   qui coûte ~4000 encodages (40 gènes x 50 x 2) et
                            #   reste donc opt-in. Les deux nulles sont
                            #   COMPLÉMENTAIRES : N2 teste le VOISINAGE, random_axis
                            #   teste l'AXE.
    random_axis_seed: 0     # fixe => mêmes directions d'une ablation à l'autre
  cluster_annotation:
    enabled: true

# ── Stage 10 : cross-method (opt-in, non câblé end-to-end)
comparison:
  enabled: false

output:
  generate_html_report: false
